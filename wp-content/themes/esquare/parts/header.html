<script>
(function () {
    var path = window.location.pathname;
    document.querySelectorAll('.esq-nav-link').forEach(function (a) {
        if (a.getAttribute('href') === path) a.setAttribute('aria-current', 'page');
    });

    var button = document.querySelector('[aria-controls="primary-nav-panel"]');
    var panel = document.getElementById('primary-nav-panel');
    if (!button || !panel) return;

    function setOpen(open) {
        button.setAttribute('aria-expanded', String(open));
        button.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
        panel.hidden = !open;
    }

    button.addEventListener('click', function () {
        setOpen(button.getAttribute('aria-expanded') !== 'true');
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && button.getAttribute('aria-expanded') === 'true') {
            setOpen(false);
            button.focus();
        }
    });

    // The panel only exists below the xl breakpoint; leaving it open while the
    // full bar takes over would strand aria-expanded on a hidden control.
    window.matchMedia('(min-width: 80rem)').addEventListener('change', function (event) {
        if (event.matches) setOpen(false);
    });
})();
</script>
